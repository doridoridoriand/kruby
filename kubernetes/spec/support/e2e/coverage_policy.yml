# frozen_string_literal: true
#
# Auto-generated exclusion policy for E2E coverage gate
# These API classes have NO targets in the E2E catalog, so all their
# candidates are excluded from the coverage gate.
#
# NOTE: CustomObjectsApi, NetworkingV1Api, and StorageV1Api are now
# partially covered — see method-level exclusions below for remaining
# uncovered methods with reasoning.

# API classes to exclude entirely (prefix match on canonical API class name)
explicitly_excluded_apis:
  - AdmissionregistrationV1Api  # 24 methods excluded — Webhook/ValidatingAdmissionPolicy require webhook endpoint infrastructure
  - AdmissionregistrationV1alpha1Api  # 12 methods excluded — alpha API, experimental ValidatingAdmissionPolicy rules
  - AdmissionregistrationV1beta1Api  # 12 methods excluded — beta API, superseded by v1
  - ApiextensionsV1Api  # 6 methods excluded — CRD lifecycle management (not tested as E2E resource targets)
  - ApiregistrationV1Api  # 6 methods excluded — APIService requires kube-apiserver aggregation layer
  - AuthenticationV1Api  # 2 methods excluded — TokenReview requires auth infrastructure
  - AuthorizationV1Api  # 4 methods excluded — SubjectAccessReview/SelfSubjectAccessReview are decision endpoints, not resources
  - AutoscalingV1Api  # 9 methods excluded — v1 HPA superseded by v2; v2 is covered
  - CertificatesV1Api  # 10 methods excluded — CertificateSigningRequest requires CA signer infrastructure
  - CertificatesV1alpha1Api  # 6 methods excluded — alpha ClusterTrustBundle, experimental
  - CertificatesV1beta1Api  # 12 methods excluded — beta CSR API, superseded by v1
  - CoordinationV1alpha2Api  # 7 methods excluded — alpha LeaseCandidate, experimental
  - CoordinationV1beta1Api  # 7 methods excluded — beta Lease, superseded by v1
  - DiscoveryV1Api  # 6 methods excluded — EndpointSlice is managed by kube-controller-manager, not manually created
  - EventsV1Api  # 7 methods excluded — Events are generated by controllers, not manually created
  - FlowcontrolApiserverV1Api  # 12 methods excluded — FlowSchema/PriorityLevelConfiguration are cluster config, not user workloads
  - InternalApiserverV1alpha1Api  # 6 methods excluded — internal KubeProxyConfiguration, not user-facing
  - NodeV1Api  # 6 methods excluded — RuntimeClass requires CRI infrastructure
  - ResourceV1Api  # 30 methods excluded — K8s 1.32+ resource.k8s.io, multi-attach pod scheduling (requires Device Plugin)
  - ResourceV1alpha3Api  # 6 methods excluded — alpha ResourceClaim, experimental
  - ResourceV1beta1Api  # 30 methods excluded — beta ResourceClaim, requires Device Plugin infrastructure
  - ResourceV1beta2Api  # 30 methods excluded — beta ResourceClaim, requires Device Plugin infrastructure
  - SchedulingV1alpha1Api  # 6 methods excluded — alpha PriorityLevelConfiguration, superseded by v1
  - SchedulingV1alpha2Api  # 18 methods excluded (K8s 1.36 PodGroup, Workload) — alpha scheduling, experimental

# Method-level exclusions for partially covered APIs
# These methods exist in the inventory but are not in the E2E target catalog.
exclude_method_patterns:
  # --- Bulk delete operations (not individually testable) ---
  - pattern: "^delete_collection_(?!namespaced_config_map$)"
    reason: "delete_collection operations stay excluded by default; namespaced config maps are covered separately"
  # --- Cluster-wide list operations (*_for_all_namespaces) ---
  - pattern: "_for_all_namespaces$"
    reason: "Cluster-wide list operations are not in E2E target catalog"
  # --- Status subresource operations ---
  - pattern: "_status$"
    reason: "Status subresource operations are not directly tested"
  # --- Scale subresource operations ---
  - pattern: "_scale$"
    reason: "Scale subresource operations are not directly tested"
  # --- Namespace status ---
  - pattern: "^patch_namespace_status$"
    reason: "Namespace status operation not in catalog"
  - pattern: "^read_namespace_status$"
    reason: "Namespace status operation not in catalog"
  - pattern: "^replace_namespace_status$"
    reason: "Namespace status operation not in catalog"
  # --- Component status ---
  - pattern: "^list_component_status$"
    reason: "Component status not in catalog"
  - pattern: "^read_component_status$"
