name: E2E Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-matrix:
    name: E2E (Ruby ${{ matrix.ruby }} × K8s ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
        kubernetes:
          - "1.31"
          - "1.32"
          - "1.33"
          - "1.34"
          - "1.35"

    defaults:
      run:
        working-directory: kubernetes

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: kubernetes

      - name: Install kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          k8s_version="${{ matrix.kubernetes }}"
          full_version="${k8s_version}.0"
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v${full_version}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Check Docker
        run: docker version

      - name: Run E2E tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/e2e/run-e2e \
            --mode full \
            --kubernetes-version "${{ matrix.kubernetes }}" \
            --real-api 1

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-ruby${{ matrix.ruby }}-k8s${{ matrix.kubernetes }}-artifacts
          path: |
            kubernetes/tmp/e2e/**
            kubernetes/spec/reports/e2e/**
          if-no-files-found: warn
          retention-days: 14