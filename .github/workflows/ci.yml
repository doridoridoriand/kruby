name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kubernetes

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: kubernetes

      - name: Run RSpec
        run: bundle exec rspec

      - name: Build gem
        run: |
          rm -f kruby-*.gem
          gem build kubernetes.gemspec
          ruby -e 'abort("gem was not built") if Dir["kruby-*.gem"].empty?'
